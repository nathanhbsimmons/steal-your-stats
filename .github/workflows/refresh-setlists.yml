name: Refresh setlist cache

on:
  schedule:
    - cron: '0 8 * * *' # daily, 08:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh .cache/gd-setlists.json
        env:
          SETLISTFM_API_KEY: ${{ secrets.SETLISTFM_API_KEY }}
        run: node scripts/refresh-setlists.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- .cache/gd-setlists.json; then
            echo "No changes, skipping commit."
            exit 0
          fi
          git add .cache/gd-setlists.json
          git commit -m "chore: refresh setlist cache"
          git push
